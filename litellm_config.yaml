general_settings:
  alert_types: []

router_settings:
  # Map native Anthropic model names requested by Claude Code to NVIDIA agents
  model_group_alias:
    "claude-3-5-sonnet-20241022": "nvidia-agent"
    "claude-3-5-sonnet-latest": "nvidia-agent"
    "claude-3-5-haiku-20241022": "nvidia-fast-agent"
    "claude-3-5-haiku-latest": "nvidia-fast-agent"
    "claude-sonnet-4-6": "nvidia-agent"
    "claude-haiku-4-6": "nvidia-fast-agent"


model_list:
  # 1. Primary coding model (using Mistral Large 3 - Top Tier capability)
  - model_name: "nvidia-agent"
    litellm_params:
      model: "nvidia_nim/mistralai/mistral-large-3-675b-instruct-2512"
      api_key: "os.environ/NVIDIA_API_KEY"
      drop_params: true
      rpm: 40

  # 2. Fast background model (using Llama 3.3 70B - Robust secondary)
  - model_name: "nvidia-fast-agent"
    litellm_params:
      model: "nvidia_nim/meta/llama-3.3-70b-instruct"
      api_key: "os.environ/NVIDIA_API_KEY"
      drop_params: true
      rpm: 40



  # 4. Cleaned & verified active NVIDIA models
  - model_name: "qwen/qwen3.5"
    litellm_params:
      model: "nvidia_nim/qwen/qwen3-next-80b-a3b-instruct"
      api_key: "os.environ/NVIDIA_API_KEY"
      drop_params: true
      rpm: 40

  - model_name: "meta/llama-3.3-70b-instruct"
    litellm_params:
      model: "nvidia_nim/meta/llama-3.3-70b-instruct"
      api_key: "os.environ/NVIDIA_API_KEY"
      drop_params: true
      rpm: 40

  - model_name: "mistralai/mixtral-8x7b-instruct-v0.1"
    litellm_params:
      model: "nvidia_nim/mistralai/mixtral-8x7b-instruct-v0.1"
      api_key: "os.environ/NVIDIA_API_KEY"
      drop_params: true
      rpm: 40

  - model_name: "microsoft/phi-4-mini-instruct"
    litellm_params:
      model: "nvidia_nim/microsoft/phi-4-mini-instruct"
      api_key: "os.environ/NVIDIA_API_KEY"
      drop_params: true
      rpm: 40

  - model_name: "google/gemma-2-2b-it"
    litellm_params:
      model: "nvidia_nim/google/gemma-2-2b-it"
      api_key: "os.environ/NVIDIA_API_KEY"
      drop_params: true
      rpm: 40

litellm_settings:
  callbacks:
    - custom_callbacks.proxy_handler_instance