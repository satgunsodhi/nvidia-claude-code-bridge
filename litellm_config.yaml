general_settings:
  alert_types: []

router_settings:
  # Map native Anthropic model names requested by Claude Code to NVIDIA agents
  model_group_alias:
    "claude-3-opus-20240229": "nvidia-opus-agent"
    "claude-3-5-sonnet-20241022": "nvidia-agent"
    "claude-3-5-sonnet-latest": "nvidia-agent"
    "claude-3-5-sonnet-20240620": "nvidia-agent"
    "claude-3-sonnet-20240229": "nvidia-agent"
    "claude-sonnet-4-6": "nvidia-agent"
    "anthropic_sonnet": "nvidia-agent"
    
    "claude-3-5-haiku-20241022": "nvidia-fast-agent"
    "claude-3-5-haiku-latest": "nvidia-fast-agent"
    "claude-haiku-4-6": "nvidia-fast-agent"
    "anthropic_haiku": "nvidia-fast-agent"

  enable_pre_call_checks: true
  num_retries: 3
  
  # Common Class-Based Fallbacks for all models
