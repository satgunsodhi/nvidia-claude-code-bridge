general_settings:
  alert_types: []

router_settings:
  # Map native Anthropic model names requested by Claude Code to NVIDIA agents
  model_group_alias:
    "claude-3-5-sonnet-20241022": "nvidia-agent"
    "claude-3-5-sonnet-latest": "nvidia-agent"
    "claude-3-5-sonnet-20240620": "nvidia-agent"
    "claude-3-sonnet-20240229": "nvidia-agent"
    "claude-sonnet-4-6": "nvidia-agent"
    "anthropic_sonnet": "nvidia-agent"
    
    "claude-3-5-haiku-20241022": "nvidia-fast-agent"
    "claude-3-5-haiku-latest": "nvidia-fast-agent"
    "claude-haiku-4-6": "nvidia-fast-agent"
    "anthropic_haiku": "nvidia-fast-agent"

  enable_pre_call_checks: true
  num_retries: 3
  
  fallbacks:
    - nvidia-agent: ["nvidia-agent-fallback-1", "nvidia-agent-fallback-2", "nvidia-agent-fallback-3"]
    - nvidia-fast-agent: ["nvidia-fast-agent-fallback-1", "nvidia-fast-agent-fallback-2", "nvidia-fast-agent-fallback-3"]

  # Fallbacks for context window limit exceeded
  context_window_fallbacks:
    - nvidia-agent: ["nvidia-agent-fallback-1", "nvidia-agent-fallback-2", "nvidia-agent-fallback-3"]
    - nvidia-fast-agent: ["nvidia-fast-agent-fallback-1", "nvidia-fast-agent-fallback-2", "nvidia-fast-agent-fallback-3"]

model_list:
  # --- PRIMARY MULTIMODAL AGENTS (High quality, but capped at 32k context) ---
  
  - model_name: "nvidia-agent"
    litellm_params:
      model: "nvidia_nim/meta/llama-3.2-90b-vision-instruct"
      api_key: "os.environ/NVIDIA_API_KEY"
      drop_params: true
    model_info:
      max_input_tokens: 32768
      
  - model_name: "nvidia-fast-agent"
    litellm_params:
      model: "nvidia_nim/meta/llama-3.2-11b-vision-instruct"
      api_key: "os.environ/NVIDIA_API_KEY"
      drop_params: true
    model_info:
      max_input_tokens: 32768

  # --- QUALITY TEXT FALLBACKS (Large context windows, high availability) ---
  
  - model_name: "nvidia-agent-fallback-1"
    litellm_params:
      model: "nvidia_nim/mistralai/mistral-large-3-675b-instruct-2512"
      api_key: "os.environ/NVIDIA_API_KEY"
      drop_params: true
    model_info:
      max_input_tokens: 131072

  - model_name: "nvidia-agent-fallback-2"
    litellm_params:
      model: "nvidia_nim/qwen/qwen3-next-80b-a3b-instruct"
      api_key: "os.environ/NVIDIA_API_KEY"
      drop_params: true
    model_info:
      max_input_tokens: 131072

  - model_name: "nvidia-agent-fallback-3"
    litellm_params:
      model: "nvidia_nim/meta/llama-3.3-70b-instruct"
      api_key: "os.environ/NVIDIA_API_KEY"
      drop_params: true
    model_info:
      max_input_tokens: 131072

  # --- FAST TEXT FALLBACKS (Large context windows, fast/high availability) ---
  
  - model_name: "nvidia-fast-agent-fallback-1"
    litellm_params:
      model: "nvidia_nim/meta/llama-3.3-70b-instruct"
      api_key: "os.environ/NVIDIA_API_KEY"
      drop_params: true
    model_info:
      max_input_tokens: 131072

  - model_name: "nvidia-fast-agent-fallback-2"
    litellm_params:
      model: "nvidia_nim/microsoft/phi-4-mini-instruct"
      api_key: "os.environ/NVIDIA_API_KEY"
      drop_params: true
    model_info:
      max_input_tokens: 40960

  - model_name: "nvidia-fast-agent-fallback-3"
    litellm_params:
      model: "nvidia_nim/google/gemma-2-2b-it"
      api_key: "os.environ/NVIDIA_API_KEY"
      drop_params: true
    model_info:
      max_input_tokens: 8192

litellm_settings:
  num_retries: 5  # Global retries for rate limits
  callbacks:
    - custom_callbacks.proxy_handler_instance