model_list:
  # --- PRIMARY AGENTS ---
  - model_name: "nvidia-opus-agent"
    litellm_params:
      model: "nvidia_nim/deepseek-ai/deepseek-v4-pro"
      api_key: "os.environ/NVIDIA_API_KEY"
      rpm: 40
      drop_params: true
    model_info:
      max_input_tokens: 256000

  - model_name: "nvidia-agent"
